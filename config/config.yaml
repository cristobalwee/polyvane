# Kalshi-first trading bot configuration.
# All tunable parameters live here. Conservative defaults — review before going live.

risk:
  # Fractional Kelly multiplier (0.25 = quarter Kelly). Lower = safer.
  kelly_fraction: 0.25
  # Hard global ceiling on any single position in USD. Volume tiers below
  # narrow this further per-market; whichever is tighter wins.
  # Raised $10 → $15 (2026-07-07) alongside funding the account past the
  # initial $50 — the low volume tier below must move in lockstep, since
  # every Kalshi weather market is < $50k volume and lands in that tier.
  max_position_usd: 10.0
  # Skip any trade whose Kelly-computed size lands below this. Kelly sizes
  # off available CASH, so once a few slots are open the leftover produces
  # dust orders ($0.68 entries) that burn daily/concurrent slots for
  # negligible payoff. The trade is skipped, never bumped up to the floor.
  min_position_usd: 5.0
  # Maximum NEW positions opened per UTC day across ALL strategies. This is
  # a global ceiling — for paper testing the per-strategy cap below is what
  # actually shapes behavior; this just keeps a runaway bot from filling the
  # journal. Tightened to 5 for the live $50 Kalshi run: at the $10 per-position
  # cap, ~5 positions is the entire bankroll, and Kalshi weather markets resolve
  # end-of-day so funds don't free up intraday. Scale up once validated.
  max_daily_positions: 15
  # Maximum simultaneously open positions GLOBALLY. At $10/position this is the
  # bankroll ceiling for the $50 account — opening a 6th would need funds that
  # aren't there. Bug-containment + balance ceiling in one.
  max_concurrent_positions: 10
  # Per-strategy concurrent-position cap. Each strategy gets its own slot
  # pool, so strategies don't starve each other when they fire signals
  # near-simultaneously. Matches the global cap for the single-live-strategy
  # ($50) run; raise back to ~10-20 once trading more strategies live.
  max_concurrent_positions_per_strategy: 10
  # Daily realized-loss circuit breaker. Hitting this halts ALL trading.
  # Set to $20 for the $50 account (~40% drawdown) — a real stop, not the
  # whole-bankroll non-breaker that $50 was. Raise as the bankroll grows.
  max_daily_loss_usd: 30.0
  # Maximum exposure to any single market category as a fraction of total deployed capital.
  # NOTE: in paper-mode multi-strategy testing, all variants trade weather markets,
  # so a 30% cap blocks every trade ("category would be 100% of book"). Setting to
  # 1.0 disables the cap. Tighten back down for live trading once you have signal on
  # which strategies actually work.
  max_category_exposure_pct: 1.0
  # Minimum edge required to consider a signal tradeable (10% = 0.10).
  min_edge_pct: 0.10
  # Stop-loss threshold. Exit any open position whose current midpoint has
  # fallen to <= (1 - stop_loss_pct) × entry_price. 0.50 = exit at -50%.
  # Reverted 0.35 → 0.50 (2026-07-15): counterfactual vs Kalshi settlements
  # over Jul 8–16 showed the 0.50 stop saved money (-$81 realized vs -$110
  # held; 14/17 stopped markets resolved NO) while 0.35 cost money (-$25 vs
  # -$21 held; 5/10 stopped markets went on to resolve YES). A 35% trigger
  # sits inside the normal intraday churn of daily weather markets.
  stop_loss_pct: 0.50
  # Volume-aware position caps. The first tier whose [min, max) range
  # contains the market's volumeUsd determines the per-trade ceiling.
  # Calibrated to April 2026 Polymarket conditions: deeper books at the top
  # end, but more bot competition — so caps grow modestly, not aggressively.
  volume_position_tiers:
    - name: low
      min_volume_usd: 0
      max_volume_usd: 50000
      # Kept equal to the global max_position_usd: ALL Kalshi weather
      # markets fall in this tier, so a lower value here silently re-caps
      # every live trade regardless of the global setting.
      max_position_usd: 10.0
    - name: mid
      min_volume_usd: 50000
      max_volume_usd: 200000
      max_position_usd: 15.0
    - name: high
      min_volume_usd: 200000
      max_volume_usd: inf
      max_position_usd: 25.0
  # Hard ceiling on TOTAL open exposure in any single market, summed across
  # all strategies and ladder rungs. Added 2026-07-15 after both lazy rungs
  # fired on one scan and stacked 2×$12.80 on a single Denver market (both
  # stopped out, -$24.64 — the worst single event in the live journal).
  # 1.5× the per-position cap: room for one full position plus a smaller
  # pyramid add, never a doubled book on one market. 0 disables.
  max_market_exposure_usd: 15.0
  # Reject a new trade when the strategy already holds an open position on
  # the same market_id. Default true. Strategies in the override map below
  # use their own value — `lazy` opts out so its price-ladder rungs aren't
  # rejected as duplicates.
  dedup_open_positions: true
  dedup_open_positions_per_strategy:
    lazy: false
    lazy_kalshi: false

execution:
  # paper = log only, never submit. live = real orders. Default to paper.
  # `mode` controls Polymarket. `kalshi_mode` controls Kalshi independently.
  # If kalshi_mode is omitted it inherits from mode.
  mode: paper
  # Staged for live: flip to `live` once paper validation looks good. While
  # this is `paper`, ALL Kalshi strategies are paper regardless of the
  # allowlist below (is_paper_for() short-circuits).
  kalshi_mode: live
  # Per-strategy live allowlist. ONLY these strategy instance names submit
  # live orders; every other strategy stays in paper even on a live exchange.
  # Inert while kalshi_mode is paper. The default live allowlist is Kalshi-only.
  live_strategies:
    - lazy_kalshi
    - weather_kalshi
  # limit | market. Polymarket CLOB uses limit-style GTC orders by default.
  order_type: limit
  # If true, splits each entry into multiple tranches to reduce slippage/fill risk.
  staged_entry: true
  staged_tranches: 2
  # Fraction of mid-spread to offer when posting limit orders (0.0 = at mid, 0.01 = 1% inside).
  limit_offset_pct: 0.005
  # Per-order retry configuration on transient failures.
  max_order_retries: 3
  retry_backoff_sec: 2.0
  # Abort a Kalshi order when a fresh pre-submit quote has moved more than
  # this from the scanned signal price. Trade 16 (2026-07-07) scanned Dallas
  # low at $0.69, the book collapsed to $0.02 before the crossing bid landed,
  # and the order filled 6 contracts of a dead market. Voided as stale_quote.
  max_price_drift: 0.10

polling:
  # How often each strategy's scan() is invoked.
  market_scan_interval_sec: 120
  # How often open positions are checked for exit conditions / PnL updates.
  position_check_interval_sec: 60
  # How often the risk module re-evaluates global limits (daily reset, drawdown).
  risk_check_interval_sec: 30

logger:
  # SQLite path. Relative to project root.
  db_path: data/trade_journal.db
  # Console log level: DEBUG | INFO | WARNING | ERROR
  level: INFO

api:
  # Base URL for the Polymarket CLOB. The production endpoint is unchanged
  # post-V2 migration (2026-04-28); only the backend changed.
  clob_host: https://clob.polymarket.com
  # CLOB exchange version. V2 went live on 2026-04-28. Settles in pUSD.
  exchange_version: "v2"
  # Polygon chain id.
  chain_id: 137
  # Per-request timeout (seconds).
  request_timeout_sec: 15
  # Exponential backoff parameters for retries.
  retry_max_attempts: 5
  retry_initial_delay_sec: 1.0
  retry_max_delay_sec: 30.0
  # Kalshi API settings. When present, a KalshiClient is initialized
  # alongside the Polymarket client and Kalshi strategy instances can trade.
  # Auth env vars: KALSHI_KEY_ID + KALSHI_PRIVATE_KEY_PATH.
  #
  # NOTE on paper vs live: paper mode reads live production market data —
  # the demo sandbox at demo-api.kalshi.co does NOT list the daily
  # KXHIGH/KXLOW weather contracts, so pointing paper mode at demo means
  # zero signals. Paper/live distinction is enforced at order-submission
  # time via ExecutionConfig.is_paper_for(), not at the read URL.
  # Override demo_base_url to https://demo-api.kalshi.co/trade-api/v2 only
  # if you specifically want to exercise the sandbox.
  kalshi:
    demo_base_url: https://api.elections.kalshi.com/trade-api/v2
    live_base_url: https://api.elections.kalshi.com/trade-api/v2
    request_timeout_sec: 10
    retry_max_attempts: 3
    retry_initial_delay_sec: 1.0
    retry_max_delay_sec: 30.0

monitoring:
  dashboard_refresh_sec: 30
  alerts:
    discord_webhook_url: ""    # optional
    discord_user_id: ""        # optional — numeric Discord ID (snowflake) to @ping in daily summary
    telegram_bot_token: ""     # optional
    telegram_chat_id: ""       # optional
    daily_summary_time: "13:00"
    trade_notifications: true
    new_city_notifications: true
    alert_cooldown_sec: 300
  review:
    auto_resolve_check_interval_sec: 600
    weekly_review_day: sunday
    bias_flag_threshold_pct: 0.02
    mismatch_std_dev_multiple: 2.0
    # Kalshi REST base URL for resolution polling. Auth is required by
    # Kalshi on all endpoints; the reviewer reuses the client's session
    # via main.py defaults (overridden below only if you want a different
    # endpoint for resolution lookups than for live scanning).
    kalshi_base_url: "https://api.elections.kalshi.com/trade-api/v2"
  health:
    # Minimum pUSD wallet balance before trading is paused (live mode).
    min_wallet_balance_usd: 20.0
    max_scan_gap_sec: 900
    error_alert_threshold: 5
    error_window_sec: 3600
    poll_interval_sec: 60
    # Heartbeat write cadence (seconds). The healthcheck.sh cron checks the
    # heartbeat file's mtime to detect a wedged bot.
    heartbeat_interval_sec: 60

# Default paper bankroll per strategy when a strategy isn't listed under
# `paper_bankroll_per_strategy` below. Bumped from $100 to $1000 so paper
# trades aren't artificially suppressed by Kelly sizing on a tiny pool —
# we want clean signal on which strategies actually work.
paper_bankroll_usd: 1000.0

# Per-strategy paper bankrolls. Each strategy gets its own isolated pool so
# variants can be compared apples-to-apples. In live mode this map is
# informational only — all strategies share the on-chain pUSD balance.
paper_bankroll_per_strategy:
  weather: 1000.0
  lazy:    1000.0
  weather_kalshi: 1000.0
  lazy_kalshi:    1000.0

# Reusable city list. YAML anchors keep the three weather variants in sync
# without duplicating the list.
#
# Cities marked confirmed=False in strategies/weather/resolution.py are
# still listed here so the bot recognizes their event titles (silencing
# `new_city_detected` alerts). They get filtered out at startup by
# `require_confirmed_resolution`. Flip the registry entry to confirmed=True
# after verifying one resolution against Wunderground to enable trading.
_weather_cities: &weather_cities
  [
    # Confirmed (trade enabled when require_confirmed_resolution: true)
    NYC, Dallas, Atlanta, London, Hong Kong, Toronto, Ankara, Wellington,
    Austin, Chicago, Denver, Houston, Los Angeles, Miami, San Francisco, Seattle,
    # Unconfirmed — verify station before flipping confirmed=True
    Seoul, Shanghai, Beijing, Tokyo, Singapore, Mexico City, Sao Paulo,
    Buenos Aires, Madrid, Paris, Munich, Amsterdam, Helsinki, Tel Aviv,
    Istanbul, Moscow, Warsaw, Milan, Cape Town, Manila, Jakarta, Taipei, Busan,
  ]

# Strategy registry. Each entry: name (must match a module under strategies/),
# enabled flag, and a free-form `params` block passed to the strategy at init.
strategies:
  # ---- Weather (Polymarket, dormant) -----------------------------------
  # Kept for future reactivation, but disabled by default so the service only
  # scans Kalshi markets. Flip this back on only if you intentionally want
  # Polymarket exposure again.
  # Single weather strategy, replacing the previous baseline / aggressive /
  # conservative split. The split was masking a model bug: the conservative
  # variant's tight `min_agreement` gate combined with uncalibrated forecast
  # std devs pushed it to its WORST trades (highest claimed edge, -65% ROI
  # lifetime). The agreement gate is disabled until bias correction lands.
  #
  # `per_source_std_dev_f` and `forecast_model_weights` are populated from
  # the 30-day calibrate.py run on 2026-05-09. ECMWF is dropped: the
  # historical-archive endpoint returned no samples during calibration —
  # re-add once the data path is verified.
  - name: weather
    enabled: false
    params:
      cities: *weather_cities
      require_confirmed_resolution: true
      forecast_models: [noaa, open_meteo_gfs, open_meteo_icon]
      forecast_model_weights:
        open_meteo_gfs: 0.366
        noaa: 0.326
        open_meteo_icon: 0.308
      per_source_std_dev_f:
        noaa: 2.22
        open_meteo_gfs: 2.10
        open_meteo_icon: 2.28
      # Per-city forecast bias correction (°F). Subtracted from each
      # member's mean before ensembling. Positive = forecasts run warm.
      # Sourced from `python -m strategies.weather.calibrate` on 2026-05-09
      # (30-day window, 1669 events). Refresh whenever the model set or
      # weights change. Cities not listed pass through uncorrected.
      per_city_bias_f:
        Chicago:        2.10
        Dallas:         2.02
        Denver:        -1.01
        Austin:         0.99
        NYC:           -0.88
        Hong Kong:      0.85
        Miami:          0.69
        San Francisco: -0.68
      # Floor on |bias| to actually apply. Below this, treat as noise.
      min_bias_apply_f: 0.5
      # Disabled. Empirical: requiring high agreement was selecting trades
      # where independent models shared a correlated bias — exactly the
      # losing tail. Re-enable only after we can show the gate adds value.
      min_agreement: 0.0
      agreement_scale_f: 3.0
      min_edge_pct: 0.15
      adjacent_min_edge_pct: 0.10
      trade_adjacent_buckets: true
      # Absolute floor on model_prob. Edge alone can be inflated by tiny
      # YES prices on long-shot adjacent buckets — 0.05 model_prob vs
      # $0.005 price still clears the 0.04 adjacent edge gate. The
      # 2026-05-10..25 paper journal shows model_prob<0.20 was a -$526
      # bucket across 128 trades, vs +$2046 across 74 trades in [0.20, 0.30).
      min_model_prob: 0.20
      # Reject signals claiming edge above this — almost always a model bug
      # (sign error, probability inflation, uncorrected per-city bias).
      max_edge_sanity: 0.30
      min_hours_to_resolution: 12
      max_forecast_horizon_hours: 48
      scan_interval_sec: 300
      scan_on_model_update: true
      min_liquidity_usd: 100.0
      noaa_max_rps: 5.0

  # ---- Lazy (Polymarket, dormant) --------------------------------------
  # Same strategy implementation as Kalshi lazy, but pointed at Polymarket's
  # temperature buckets. Disabled by default.
  # Replaces lazy_50 / lazy_60 / lazy_70. Entry floor $0.60 (proven by
  # 30-day journal: 1W/5L below $0.55, 50% WR at $0.55–0.60, 100% WR at
  # $0.60+). Each higher rung is a pyramid add fired exactly once per
  # (market_id, bucket_label). Requires the dedup override above so the
  # adds don't collide with the first entry.
  - name: lazy
    enabled: false
    params:
      thresholds: [0.60, 0.75]
      claimed_edge_pct: 0.10
      max_price: 0.95
      min_hours_to_resolution: 12
      max_forecast_horizon_hours: 48
      scan_interval_sec: 90
      min_liquidity_usd: 100.0

  # ---- Kalshi strategies (active) --------------------------------------
  # These use the same strategy classes as the dormant Polymarket entries,
  # but scan and trade Kalshi's binary temperature markets.
  # Kalshi binary markets: each market is "Will HIGH temp be >= X°F?"
  # Lazy strategy: identical threshold logic (buy YES when price >= 0.60).
  - name: lazy
    enabled: true
    params:
      exchange: kalshi
      # Every city Kalshi lists daily HIGH/LOW markets for (see
      # _KALSHI_CITY_CODES in strategies/weather/kalshi_markets.py). Lazy
      # needs no forecast station data — resolution comes from Kalshi's own
      # settlement — so unlike weather_kalshi the list isn't limited to the
      # kalshi_resolution registry. The spread/volume guards below still
      # gate out any city whose book is too thin to trust.
      cities: [Atlanta, NYC, Chicago, Dallas, Houston, Miami,
               Austin, Boston, Denver, Las Vegas, Los Angeles, Minneapolis,
               New Orleans, Oklahoma City, Philadelphia, Phoenix,
               San Antonio, San Francisco, Seattle, St. Louis]
      # Entry floor raised 0.65 → 0.75 (2026-07-15). Calibration over the
      # first 12 live days: 0.65-rung entries resolved YES only ~61-67%
      # while costing 66-70¢ (-$16.11 over 49 trades) — negative edge even
      # before fees. The 0.75 rung ran ~78% YES, roughly breakeven. Until
      # forecast confirmation (hybrid) gates entries, only trade the band
      # that isn't provably bleeding.
      thresholds: [0.75]
      claimed_edge_pct: 0.10
      max_price: 0.85
      # Lowered from 12 → 2 for Kalshi: daily weather thresholds only climb
      # into the 0.65 entry band as the forecast firms up near expiry, and
      # we can't yet prove that crossing happens before the 12h mark. A 2h
      # floor lets the bot buy whenever the favorite enters [0.65, 0.85];
      # max_price (0.85) still blocks the same-day near-locks (0.95+). Keep
      # the 0.65 price floor — sub-0.60 entries are negative-EV here.
      min_hours_to_resolution: 2
      max_forecast_horizon_hours: 48
      scan_interval_sec: 90
      min_liquidity_usd: 0       # Kalshi doesn't expose USD liquidity per-market
      # Liquidity guard (Fix A). The phantom $0.75 entries were zero-volume
      # tail markets with one-sided books: the bot bought the wide MM ask and
      # the stop-loss exited at ~50% (54/54 resolved $0.75 trades lost). Now
      # we price at the book midpoint and require BOTH real traded volume and
      # a tight two-sided book (spread). Tune up once we see fill quality.
      min_volume_usd: 50         # require genuine traded volume
      max_spread: 0.10           # reject wide / one-sided books (no price discovery)

  # Weather strategy: uses forecast CDF (P(temp >= threshold)) vs Kalshi
  # YES price for edge; same ensemble models and bias corrections as above.
  - name: weather
    enabled: true
    params:
      exchange: kalshi
      cities: [Atlanta, NYC, Chicago, Dallas, Houston, Miami]
      # Kalshi markets define city/date/threshold in the ticker. Forecasts
      # still use the shared city station registry for lat/lon, but Kalshi is
      # not blocked by Polymarket's confirmed-resolution gate.
      require_confirmed_resolution: false
      forecast_models: [noaa, open_meteo_gfs, open_meteo_icon]
      forecast_model_weights:
        open_meteo_gfs: 0.366
        noaa: 0.326
        open_meteo_icon: 0.308
      per_source_std_dev_f:
        noaa: 2.22
        open_meteo_gfs: 2.10
        open_meteo_icon: 2.28
      per_city_bias_f:
        Chicago:        2.10
        Dallas:         2.02
        NYC:           -0.88
        Miami:          0.69
      min_bias_apply_f: 0.5
      min_agreement: 0.0
      min_edge_pct: 0.15
      # Mirrors the Polymarket gate — see comment above.
      min_model_prob: 0.20
      max_edge_sanity: 0.30
      # Lowered 12 → 2 (Fix C) to match lazy_kalshi: daily Kalshi temperature
      # markets only price up near expiry, so a 12h floor skipped essentially
      # every market — the strategy had ZERO trades. Safe only because the
      # direction bug (P(temp>=X) applied to "<" / range markets) is now fixed.
      min_hours_to_resolution: 2
      max_forecast_horizon_hours: 48
      scan_interval_sec: 300
      noaa_max_rps: 5.0
      # Liquidity guard (Fix A) — don't compute an edge against a phantom mid.
      min_volume_usd: 50
      max_spread: 0.10

  # ---- Other strategies (still scaffolds — disabled) -------------------
  - name: arbitrage
    enabled: false
    params:
      min_spread_pct: 0.04
      min_book_depth_usd: 50
      max_position_usd: 10
      scan_interval_sec: 30
      fee_buffer_pct: 0.01
      share_market_data: true
      categories: []
  - name: whale
    enabled: false
    params:
      tracked_wallets: []
      min_wallet_score: 0.7
      min_trade_size_usd: 5000
      consensus_threshold: 0.8
      scan_interval_sec: 60
      rpc_provider_url: ""
      exclude_arb_bots: true
      categories: []

# Shared market-data cache used by strategies to avoid redundant API calls.
# Each strategy that reads market metadata writes into the cache; later
# scans by other strategies read fresh entries instead of refetching.
market_cache:
  default_ttl_sec: 30
